<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marcianas</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fontes do Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="media/favicon.png">
    
    <style>
        @property --grad-angle {
            syntax: '<angle>';
            inherits: false;
            initial-value: 0deg;
        }

        .fixed-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -2;
            background: linear-gradient(var(--grad-angle), #0a010d, #4A0B1E, #8b1c1c, #1f0312, #6b1022);
            background-size: 400% 400%;
            animation: gradientBG 40s linear infinite;
            will-change: background-position, --grad-angle;
        }

        body {
            font-family: 'Inter', sans-serif;
            color: #F3F4F6;
            min-height: 100vh;
            overflow-x: hidden;
            background-color: #0a010d;
        }

        @keyframes gradientBG {
            0% { 
                background-position: 0% 50%; 
                --grad-angle: 0deg;
            }
            50% { 
                background-position: 100% 50%; 
                --grad-angle: 180deg;
            }
            100% { 
                background-position: 0% 50%; 
                --grad-angle: 360deg;
            }
        }

        .blob-animate-1 {
            animation: moveBlob1 20s infinite alternate ease-in-out;
        }
        .blob-animate-2 {
            animation: moveBlob2 25s infinite alternate ease-in-out;
        }
        .blob-animate-3 {
            animation: moveBlob3 30s infinite alternate ease-in-out;
        }

        @keyframes moveBlob1 {
            0% { transform: translate(0, 0) scale(1); opacity: 0.2; }
            100% { transform: translate(50px, 50px) scale(1.2); opacity: 0.4; }
        }
        @keyframes moveBlob2 {
            0% { transform: translate(0, 0) scale(1); opacity: 0.1; }
            100% { transform: translate(-50px, -30px) scale(1.3); opacity: 0.3; }
        }
        @keyframes moveBlob3 {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 0.3; }
            100% { transform: translate(-45%, -55%) scale(1.1); opacity: 0.5; }
        }

        .glass-block {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .text-red-accent { color: #FF2A2A; }
        .border-red-accent { border-color: #FF2A2A; }
        
        .content-block {
            color: #e5e7eb;
            font-size: 1.125rem;
        }
        
        @media (max-width: 768px) {
            .content-block { font-size: 1rem; }
        }

        .content-block p {
            margin-bottom: 1.25rem;
            line-height: 1.7;
            font-weight: 300;
        }
        .content-block p:last-child { margin-bottom: 0; }
        
        .content-block h2 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #ffffff;
            margin-top: 1.5rem;
            margin-bottom: 1rem;
            line-height: 1.3;
        }
        
        .content-block h3 {
            font-size: 1.25rem;
            font-weight: 600;
            color: #ffffff;
            margin-top: 1.25rem;
            margin-bottom: 0.75rem;
        }

        .content-block strong { font-weight: 600; color: #ffffff; }
        .content-block em { font-style: italic; color: #d1d5db; }
        
        .content-block ul {
            list-style-type: disc;
            padding-left: 1.5rem;
            margin-bottom: 1.25rem;
            font-weight: 300;
        }
        
        .content-block ol {
            list-style-type: decimal;
            padding-left: 1.5rem;
            margin-bottom: 1.25rem;
            font-weight: 300;
        }
        
        .content-block li { margin-bottom: 0.5rem; }
        
        .content-block a {
            color: #FF2A2A;
            text-decoration: underline;
            text-underline-offset: 4px;
            transition: color 0.2s ease;
        }
        
        .content-block a:hover { color: #ffffff; }
        
        .content-block blockquote {
            border-left: 3px solid rgba(255, 255, 255, 0.2);
            padding-left: 1rem;
            margin-left: 0;
            margin-bottom: 1.25rem;
            font-style: italic;
            color: #9ca3af;
        }

        .content-block img {
            border-radius: 0.75rem;
            margin-bottom: 1.25rem;
            width: 100%;
            max-height: 200px;
            object-fit: cover;
        }

        .img-wrapper {
            position: relative;
            display: block;
            width: 100%;
            margin-bottom: 1.25rem;
        }
        .img-wrapper img {
            margin-bottom: 0;
        }

        .img-tooltip {
            position: absolute;
            bottom: 1rem;
            left: 50%;
            transform: translateX(-50%) translateY(10px);
            background: rgba(48, 8, 19, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #F3F4F6;
            font-size: 0.8rem;
            font-family: 'Inter', sans-serif;
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.3s ease;
            white-space: nowrap;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }

        .img-wrapper:hover .img-tooltip {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body class="antialiased relative selection:bg-[#FF2A2A] selection:text-white">

    <div class="fixed-bg"></div>

    <div class="fixed top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
        <div class="absolute top-[5%] left-[5%] w-[30rem] h-[30rem] rounded-full bg-[#8A1538] mix-blend-screen filter blur-[100px] blob-animate-1"></div>
        <div class="absolute bottom-[10%] right-[5%] w-[40rem] h-[40rem] rounded-full bg-[#FF2A2A] mix-blend-screen filter blur-[150px] blob-animate-2"></div>
        <div class="absolute top-[50%] left-[50%] w-[50rem] h-[50rem] rounded-full bg-[#300813] mix-blend-multiply filter blur-[100px] blob-animate-3"></div>
    </div>

    <header class="w-full max-w-3xl mx-auto px-6 py-12">
        <h1 class="text-3xl font-semibold tracking-wide text-white border-b border-white/10 pb-6">
            Registros<span class="text-red-accent">.</span>
        </h1>
    </header>

    <main id="posts-container" class="w-full max-w-3xl mx-auto px-6 pb-24 flex flex-col gap-12">
    </main>

    <script>
        const postsData = [
            {
                date: "31 de Agosto, 2026 &mdash; 17h20",
                image: null,
                content: `
                    <h2>TNM várias vezes</h2>
                    <p>Ele sempre vem. Cedo ou tarde aquela coisa vem. Acho que é uma amálgama da primeira com a sétima e com certeza a quarta. Essas coisas tem sempre esse jeito de vir me apunhalar.</p>
                    <p>Sinto que... Na verdade eu vejo tudo isso como um grande trem descarrilhado. Sem controle, com suas dezenas de toneladas vindo na minha direção. Eu sei que vou morrer. Cedo ou tarde vai acontecer, sempre acontece. Eu sempre morro. Acho que morri umas... Sei lá... Trinta e poucas vezes? No começo espantava mais, eu evitava, eu tentava me esconder. Mas hoje? Eu só espero a desgraça acontecer.</p>
                    <p>Hoje mesmo, vi os sinais lá de longe. Um desespero no meu corpo parecia me controlar, meus olhos tinham uma pressão estranha também, só sei que tudo estava zunindo num sentido diferente. Espiralando pro lado errado. Era ele, o trem. Veio como um cometa e cortou meu pescoço fora. O sangue jorrou põe todo lado, manchou meus ombros, meu pescoço, minha roupa ficou manchada, suja. Precisava trocar, precisava tirar... Precisava ser outra pessoa.</p>
                    <p>Mas não sei não ser eu. Ele tinha me avisado do que estava pra acontecer, eu só esqueci. Eu esqueço de tudo. Eu podia andar pro lado e as coisas iam solucionar, eu acho. Mas eu fiz coisa errada, não foi? Eu sempre faço.</p>
                    <p>A real é que morrer é a única coisa que eu realmente estou acostumada. Eu nem tento evitar.</p>
                `
            },
            {
                date: "31 de Agosto, 2026 &mdash; 07h00",
                image: null,
                content: `
                    <h2>Desencantamento Boreal</h2>
                    <p>Tem algo aqui, algo mais fundo do que a gente percebe. Eu tenho essa impressão muito forte quando eu viajo pelo cosmos enquanto durmo. São sempre os mesmos lugares e mesmas coisas. Eu sintonizo em outros mundos. E nem é tão difícil assim, é apenas questão de fechar os olhos e descolar o corpo da alma e do espírito.</p>
                    <p>Eu fico gravemente perdida quando paro pra perceber o quão sugestiva é a realidade. É tudo opcional. Claro, tem umas regras lá. Mas é tudo um grande teatro que a gente participa. Por quê a sociedade se estrutura assim? Por quê a gente faz as coisas do jeito que fazemos? Por que ninguém mais sente que a matéria tem uma textura palpável? Por quê ninguém mais toca nela?</p>
                    <p>Esse ônibus é cinca, com estrias verticais azuladas. Quando passa a mão na estrutura da materialidade da impressão, da pra sentir a porosidade, a aspereza.</p>
                    <p>O ruído de fundo do mundo é algo entre o branco e prateado, uma névoa líquida que cintila quando você se esfrega por ela.</p>
                `
            },
            {
                date: "30 de Agosto, 2026 &mdash; 08h25",
                image: {
                    url: "https://images.unsplash.com/photo-1601903060992-09a591e36f1c?q=80&w=1456&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D",
                    alt: "Foto de Ignacio Amenábar na Unsplash"
                },
                content: `
                    <h2 id="tudo-isso-tnm">Tudo isso é TNM</h2>
                    <p>Sinto que preciso desaparecer. Morrer, eu acho, seria a coisa mais próxima ao que eu sinto que preciso fazer.</p>
                    <p>Não vou morrer, não antes da hora, não antes deles virem me buscar.</p>
                    <p>Mas imagina o silêncio, por um minuto, o silêncio que a não existência pode me proporcionar? Não seria legal não estar mais aqui pra não precisar lidar com isso tudo? Não precisar lidar com a dor e as sensações da carne que me arranham, que me consomem, que me fazem lembrar que eu inteira sou apodrecida até o fundo da minha carne?</p>
                    <p>Eu preciso não estar mais aqui. Minha carne fere demais, me incomoda demais. É cheia de anseios, de sensações... Sinto um aperto na garganta me dizendo pra pegar uma faca e arrancar meu corpo de mim mesma... Existir é terrível. Ter um corpo é tenebroso.</p>
                    <p>A garganta fechada, não me deixa falar. Empurra as lágrimas pra fora, mas no meio do caminho os olhos secam. Nem o prazer de um pranto eu mereço? Queria chorar de soluçar, pra poder sentir alguma coisa. Sentir que eu ainda estou aqui e que existo. Quero sair correndo, quero fazer com que meu corpo pegue fogo de tanta dor,</p>
                    <p>Eu preciso da dor pra estar viva. Se não sei o que sinto, o que sou, o que quero, pelo menos sei que a dor é inegavelmente uma coisa terrível. Isso eu sei nomear. As marcas na minha carne sinalizando o óbvio. Que eu não presto. Quê não mereço carinho, que mereço desaparecer.</p>
                    <p>Mas... Como conectar isso ao fato de que está tudo indo bem?</p>
                    <p>Traga a picareta de gelo, por favor.</p>
                `
            },
            {
                date: "29 de Agosto, 2026 &mdash; 01h01",
                image: {
                    url: "https://images.unsplash.com/photo-1710580889701-9fa8f2cd5927?q=80&w=1470&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D",
                    alt: "Foto de engin akyurt na Unsplash"
                },
                content: `
                    <h2>Começando um blog esquisito aqui :)</h2>
                    <p>
                    Meu corpo inteiro foi resetado. Meu corpo, minha mente, minha alma, minha morte. Tudo resetou.
                    <br>
                    Na minha angústia de querer estar viva, não consegui perceber que, de fato, já estava viva.
                    </p>
                    <p>
                    Havia tanto tempo que eu estava tentando entender o que estava acontecendo, que no turbilhão eu me perdi no campo das possibilidades infinitas. Corri pro passado, pra algum lugar confortável de se estar. E fiquei lá. Tonta. Presa. Tentando me agarrar nas coisas que jamais vivi ou viveria.
                    </p>
                    <p>
                    Tonta. Completamente esquecida de quem eu deveria ser, quem eu sempre fui, quem eu estava sendo, quem eu estava construindo. De quem eu nasci sendo pra ser quem eu sou e quero ser! 
                    </p>
                    <p>
                        Eu deixei de morrer, acho que pela quarta ou quinta vez.
                    </p>
                `
            }
        ];

        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('posts-container');
            
            postsData.forEach(post => {
                const article = document.createElement('article');
                article.className = 'glass-block rounded-2xl p-6 md:p-10 border-l-4 border-l-red-accent';
                
                let imageHtml = '';
                if (post.image && post.image.url) {
                    imageHtml = `
                        <div class="img-wrapper">
                            <img src="${post.image.url}" alt="${post.image.alt || ''}">
                            ${post.image.alt ? `<div class="img-tooltip">${post.image.alt}</div>` : ''}
                        </div>
                    `;
                }

                article.innerHTML = `
                    <time class="block text-red-accent text-xs font-semibold tracking-widest uppercase mb-6">
                        ${post.date}
                    </time>
                    <div class="content-block">
                        ${imageHtml}
                        ${post.content}
                    </div>
                `;
                
                container.appendChild(article);
            });
        });
    </script>
</body>
</html>
